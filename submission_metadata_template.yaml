# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Two-stage deterministic pipeline ranking 100k candidates against a structured JD —
  no LLM calls, no API costs, fully local.

  Stage 1 hard-disqualifies obvious rejects (wrong city, <4 years exp, manager-only
  titles), cutting ~60% of candidates immediately. Survivors are coarse-scored via a
  scikit-learn TF-IDF vectorizer combined with skill coverage to shortlist the top ~3000.

  Stage 2 runs full 5-component weighted scoring on the shortlist in parallel using
  ProcessPoolExecutor:
    final_score = 0.35 × skill_match + 0.30 × experience + 0.25 × text_similarity + 0.10 × location
  multiplied by a disqualifier penalty (×0.0 / ×0.35 / ×0.75 by severity).

  Skills are matched via alias expansion (e.g. "FAISS" → "Vector Databases"), then
  weighted by proficiency level, duration, and recency. Free-text fields are
  regex-scanned to surface signals absent from structured skill lists. Six behavioral
  disqualifiers catch problematic patterns: research-only careers, LangChain-only
  wrappers, stale non-coding leads, title chasers, framework-shallow profiles, and
  pure consulting backgrounds.

  Every score component is stored in the output JSON — fully traceable and auditable.
  No neural models, no generated text; hallucinations are architecturally impossible.

